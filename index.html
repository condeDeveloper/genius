<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Genius</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Genius</h1>
    <p class="sub">Repita a sequência de cores e sons. Cada rodada acrescenta um passo.</p>

    <section class="device">
      <button class="pad green" data-pad="0" aria-label="verde"></button>
      <button class="pad red" data-pad="1" aria-label="vermelho"></button>
      <button class="pad yellow" data-pad="2" aria-label="amarelo"></button>
      <button class="pad blue" data-pad="3" aria-label="azul"></button>
      <div class="center">
        <div class="display" id="display">--</div>
        <div class="label" id="label">Genius</div>
        <button id="start">Iniciar</button>
        <div class="options">
          <label><input type="checkbox" id="strict"> Modo rígido</label>
        </div>
      </div>
    </section>

    <p class="best" id="best"></p>
    <p class="hint">Teclas <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>4</kbd> também funcionam. No modo rígido, um erro encerra o jogo.</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/sequence.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
